[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naot-wong", email = "toan.vong@bioturing.com" }
]
requires-python = ">=3.14"
dependencies = [
    "biocircle>=0.5.1",
    "fastmcp>=4.0.3",
    "fastmcp-docs>=1.0.0",
    "jinja2>=3.1.0",
    "polars>=1.44.0",
    "qdrant-client>=1.19.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
biocircle = { index = "bioturing" }

[[tool.uv.index]]
name = "bioturing"
url = "https://pypi.bioturing.com/simple/"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Two data tiers: tier 1 (default) is hermetic (synthetic fixture + throwaway
# qdrant container); tier 2 is the `live` marker — real dataset pins, opt-in:
#   uv run pytest            # everything but live
#   uv run pytest -m live    # the live tier only
markers = [
  "live: needs the compose stack with the real dataset loaded (fails loudly)",
]
addopts = '-m "not live"'
filterwarnings = [
  # starlette 1.6.0's TestClient uses the deprecated anyio.abc alias internally
  # (nothing newer published yet); scoped to that module so other deprecations
  # still surface.
  "ignore::DeprecationWarning:starlette.testclient",
]
