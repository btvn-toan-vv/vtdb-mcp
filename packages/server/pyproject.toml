[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naot-wong", email = "toan.vong@bioturing.com" }
]
requires-python = ">=3.14"
dependencies = [
    "biocircle>=0.5.1",
    "fastmcp>=4.0.3",
    "fastmcp-docs>=1.0.0",
    "polars>=1.44.0",
    "qdrant-client>=1.19.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
biocircle = { index = "bioturing" }

[[tool.uv.index]]
name = "bioturing"
url = "https://pypi.bioturing.com/simple/"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
