apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: vtdb-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        # Alloy relabels this pod label into the Loki `service` stream label.
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          # Local image built from packages/server/docker/Dockerfile; load it
          # into the cluster first (`kind load docker-image`).
          image: vtdb-mcp-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind all interfaces so the Service is reachable.
            - name: VTDB_HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
