# vtdb-mcp on Kubernetes — the MCP server plus its log pipeline:
#   server   FastMCP over streamable-http (/mcp) + /health, logs to stdout
#   alloy    tails this namespace's pod logs via the Kubernetes API, parses +
#            labels the lines, pushes them to Loki
#   loki     single-binary log store (filesystem PVC)
#   grafana  log UI, provisioned Loki datasource + "vtdb-mcp · Logs" dashboard
#
# Apply (kubectl's built-in kustomize; ConfigMaps are generated from the config
# files next to the workloads — edit a config file and re-apply):
#
#   kind load docker-image vtdb-mcp-server:dev    # make the local image visible
#   kubectl apply -k k8s/
#   kubectl -n vtdb-mcp get pods
#
# Reach the UIs (no ingress/NodePort — port-forward is the loopback-local way):
#   kubectl -n vtdb-mcp port-forward svc/grafana 3000:3000   # admin / admin
#   kubectl -n vtdb-mcp port-forward svc/server  8000:8000   # /mcp, /health
#
# Tear down: kubectl delete -k k8s/   (adds PVCs: the -k list includes them)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vtdb-mcp

resources:
  - namespace.yaml
  - server/deployment.yaml
  - server/service.yaml
  - alloy/rbac.yaml
  - alloy/deployment.yaml
  - alloy/service.yaml
  - loki/pvc.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - alloy/config.alloy
  - name: loki-config
    files:
      - loki/config.yaml
  - name: grafana-provisioning
    files:
      - loki.yaml=grafana/provisioning/datasources/loki.yaml
      - dashboards.yaml=grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards
    files:
      - vtdb-mcp-logs.json=grafana/dashboards/vtdb-mcp-logs.json
