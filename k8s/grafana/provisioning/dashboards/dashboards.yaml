# Load dashboard JSON files from /var/lib/grafana/dashboards (mounted from the
# grafana-dashboards ConfigMap).
apiVersion: 1

providers:
  - name: vtdb-mcp
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
